# ==============================================================================
# Nginx Reverse Proxy Configuration for Platinum Gym API (api.gym.com)
# Place in: /etc/nginx/sites-available/api.gym.com.conf
# Symlink: ln -s /etc/nginx/sites-available/api.gym.com.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Rate limit zone: 30 requests per second per IP with burst allowance of 50
limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=30r/s;

# Upstream Node.js / PM2 cluster listening on local loopback port 8000
upstream platinum_gym_backend_upstream {
    server 127.0.0.1:8000;
    keepalive 64;
}

# --- HTTP (Port 80) -> Automatic Redirect to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name api.gym.com;

    # Allow Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (Port 443) Primary Server Block ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.gym.com;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.gym.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gym.com/privkey.pem;

    # Modern TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Request Body Limits (avatar uploads, payloads)
    client_max_body_size 10M;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Access & Error Logs
    access_log /var/log/nginx/platinum_gym_api_access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/platinum_gym_api_error.log warn;

    # Health Check Endpoint bypasses rate limits for monitoring probes
    location = /api/v1/health {
        proxy_pass http://platinum_gym_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Endpoints with Rate Limiting and Reverse Proxying
    location / {
        limit_req zone=api_rate_limit burst=50 nodelay;

        proxy_pass http://platinum_gym_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable proxy buffering for streaming responses
        proxy_buffering off;
    }
}
