version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # MongoDB Single-Node Replica Set (Required for Prisma Transactions)
  # ----------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: platinum_gym_mongo
    restart: unless-stopped
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # Ephemeral Init Service: Auto-initializes Replica Set 'rs0'
  # ----------------------------------------------------------------------------
  mongo-init:
    image: mongo:7.0
    container_name: platinum_gym_mongo_init
    restart: 'no'
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        echo "Waiting for MongoDB to be ready..."
        sleep 2
        mongosh --host mongo:27017 --eval '
          try {
            var status = rs.status();
            if (status.ok === 1) {
              print("Replica set rs0 is already initiated.");
            }
          } catch(e) {
            print("Initiating replica set rs0...");
            var res = rs.initiate({
              _id: "rs0",
              members: [{ _id: 0, host: "mongo:27017" }]
            });
            printjson(res);
          }
        '
        echo "Replica set initialization complete."

  # ----------------------------------------------------------------------------
  # Platinum Gym Express TypeScript API
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: platinum_gym_api
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      - NODE_ENV=production
      - PORT=8000
      - DATABASE_URL=mongodb://mongo:27017/platinum_gym?replicaSet=rs0&directConnection=true
      - CORS_ORIGIN=http://localhost:3000,https://gym.com
      - LOG_LEVEL=info
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
      - JWT_SECRET=change-this-jwt-secret-in-production-min-32-chars
      - JWT_EXPIRES_IN=15m
      - REFRESH_TOKEN_EXPIRES_DAYS=30
      - COOKIE_DOMAIN=
      - COOKIE_SAME_SITE=lax
      - BACKEND_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:3000
      - SSLCOMMERZ_STORE_ID=testbox
      - SSLCOMMERZ_STORE_PASS=qwerty
      - SSLCOMMERZ_IS_SANDBOX=true
      - SSLCOMMERZ_GATEWAY_MODE=fake
    depends_on:
      mongo-init:
        condition: service_completed_successfully

volumes:
  mongo_data:
    driver: local
